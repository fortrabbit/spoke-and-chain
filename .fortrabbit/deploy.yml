apiVersion: 1.0
build:
  buildCommands:
    - composer install --no-dev --prefer-dist --no-interaction --no-ansi --no-progress
    - npm install
    - npm run build
  postDeployCommands:
    - php craft up --interactive=0
  cachedDirectories:
    - storage/runtime
distribution:
  gitSourceDirectory: web
  strategy: merge
  excludePatterns: []
  replacePatterns: []
